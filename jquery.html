<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p class="para" id="para">Lorem ipsum dolor sit amet.</p>
    <button id="hide">Toggle</button>
    <script src="jquery-4.0.0.min.js"></script>
    <script>
        $('#hide').click(function(){
            $('p').toggle()
        })

    </script>
</body>
</html>
